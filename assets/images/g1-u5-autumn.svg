<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#86efac" />
    </linearGradient>
  </defs>

  <!-- 背景天空与远景山丘 -->
  <rect x="0" y="0" width="600" height="240" rx="8" fill="url(#sky)" />
  <path d="M0,170 Q150,130 320,165 T600,160 L600,240 L0,240 Z" fill="#dcfce7" opacity="0.6" />
  <path d="M0,190 Q220,170 440,195 T600,190 L600,240 L0,240 Z" fill="url(#ground)" />

  <!-- 太阳与白云 -->
  <circle cx="520" cy="55" r="28" fill="#fde047" opacity="0.9" />
  <path d="M120,45 Q135,30 155,35 Q175,25 195,35 Q215,35 220,50 Q225,65 205,65 L130,65 Q115,65 120,45 Z" fill="#ffffff" opacity="0.9" />
  <path d="M380,60 Q392,48 408,52 Q424,44 440,52 Q456,52 460,64 Q464,76 448,76 L388,76 Q376,76 380,60 Z" fill="#ffffff" opacity="0.85" />

  <!-- 飘落的秋叶 -->
  <g fill="#f59e0b" opacity="0.85">
    <path d="M260,80 Q275,70 280,85 Q265,95 260,80 Z" transform="rotate(15 270 80)" />
    <path d="M330,110 Q345,100 350,115 Q335,125 330,110 Z" transform="rotate(-20 340 110)" />
    <path d="M470,140 Q485,130 490,145 Q475,155 470,140 Z" transform="rotate(35 480 140)" />
    <path d="M220,150 Q235,140 240,155 Q225,165 220,150 Z" transform="rotate(-10 230 150)" />
  </g>

  <!-- 左侧大苹果树 -->
  <!-- 树干 -->
  <path d="M90,220 C95,170 100,140 115,110 C125,125 135,150 140,220 Z" fill="#854d0e" />
  <!-- 树冠 -->
  <circle cx="115" cy="85" r="60" fill="#22c55e" />
  <circle cx="70" cy="95" r="45" fill="#16a34a" />
  <circle cx="155" cy="95" r="48" fill="#15803d" />
  <circle cx="110" cy="50" r="45" fill="#4ade80" />

  <!-- 树上的大红苹果 -->
  <g fill="#ef4444" stroke="#b91c1c" stroke-width="1.5">
    <circle cx="85" cy="70" r="9" />
    <circle cx="135" cy="65" r="9" />
    <circle cx="65" cy="115" r="9" />
    <circle cx="110" cy="110" r="9.5" />
    <circle cx="155" cy="115" r="9" />
    <circle cx="95" cy="135" r="8.5" />
  </g>
  <!-- 苹果把和小绿叶 -->
  <path d="M85,61 Q87,55 90,56" stroke="#78350f" stroke-width="2" fill="none" />
  <path d="M135,56 Q137,50 140,51" stroke="#78350f" stroke-width="2" fill="none" />
  <path d="M110,101 Q112,95 115,96" stroke="#78350f" stroke-width="2" fill="none" />
  <path d="M155,106 Q157,100 160,101" stroke="#78350f" stroke-width="2" fill="none" />

  <!-- 右侧果园丰收果篮 -->
  <!-- 提手 -->
  <path d="M380,185 C380,145 440,145 440,185" fill="none" stroke="#a16207" stroke-width="4" stroke-linecap="round" />
  <!-- 篮身 -->
  <path d="M370,185 L382,225 L438,225 L450,185 Z" fill="#d97706" stroke="#92400e" stroke-width="2.5" />
  <!-- 篮内编织纹理 -->
  <line x1="375" y1="198" x2="445" y2="198" stroke="#b45309" stroke-width="1.5" />
  <line x1="378" y1="212" x2="442" y2="212" stroke="#b45309" stroke-width="1.5" />
  <!-- 篮子里装满的大红苹果 -->
  <g fill="#ef4444" stroke="#b91c1c" stroke-width="1.5">
    <circle cx="392" cy="182" r="10" />
    <circle cx="410" cy="178" r="10.5" />
    <circle cx="428" cy="182" r="10" />
    <circle cx="400" cy="190" r="9.5" />
    <circle cx="420" cy="190" r="9.5" />
  </g>
  <!-- 篮旁地上掉落的苹果 -->
  <circle cx="465" cy="218" r="9" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
  <path d="M465,209 Q467,204 470,205" stroke="#78350f" stroke-width="1.5" fill="none" />

  <!-- 草丛装饰 -->
  <path d="M220,225 L225,210 L230,225 L235,212 L240,225" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M500,228 L504,215 L508,228 L512,217 L516,228" stroke="#16a34a" stroke-width="2.5" fill="none" stroke-linecap="round" />
</svg>
